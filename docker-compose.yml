version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogdb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
    command: sh -c "npm install && npx sequelize db:migrate && npm run dev"

volumes:
  db-data:
